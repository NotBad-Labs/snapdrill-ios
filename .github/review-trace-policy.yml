# F-005 PR Review Trace 校验策略（S-D7-002 共识落地）
#
# PR body 必须包含 `## F-005 Review Trace` 段，字段格式严格 key:value（Codex 设计）。
# Evidence 字段做占位符防御（Antigravity 设计 placeholder_patterns 融合）。
# UI 改动文件触发 Xcode Review 必填（Codex path_globs 联动）。

version: 1
required_section: "## F-005 Review Trace"

# 所有 PR（无论 review_required 还是 exempt）都必须有的字段
required_fields:
  - Review Required
  - Review Scope
  - Human Merge Approval

normal_review:
  review_required: "yes"
  required_fields:
    - Codex Review
    - Codex Evidence
    - Findings Resolved
  accepted_verdicts: ["PASS", "PASS_WITH_FINDINGS"]
  optional_review_fields:
    - Gemini Review
    - Xcode Review
    - Antigravity Review

# Antigravity 增强：占位符防御。Evidence/Description 字段值匹配以下任一即拒绝
# 用以拦截「`[填写...]` / TBD / `...` / 单字符 x」等模板占位符
placeholder_patterns:
  - "^\\[填[写入]"
  - "^\\[fill[ \\-]?in"
  - "^tbd$"
  - "^TBD$"
  - "^TODO$"
  - "^placeholder$"
  - "^\\.\\.\\.+$"
  - "^x$"
  - "^xxx+$"
  - "^N/A$"   # 仅 Evidence 字段拒绝；verdict 自身的 N/A 通过 accepted_verdicts 路径校验

# UI-impacting PR 必填 Xcode Review
ui_review:
  path_globs:
    - "Packages/SnapDrillFeatures/Sources/**/*.swift"
    - "Packages/SnapDrillUI/Sources/**/*.swift"
    - "SnapDrill/**/*.swift"
  required_fields:
    - Xcode Review
    - Xcode Evidence
  ui_accepted_verdicts: ["PASS", "PASS_WITH_FINDINGS"]

# 机器可读豁免（不允许「静默跳过 review」，豁免也必须留痕）
exemptions:
  docs-only:
    allowed_globs:
      - "docs/**/*.md"
      - "*.md"
      - "docs/**/*.tsv"
    # 即使是 docs-only 也不豁免的高风险路径
    denied_globs:
      - "docs/protocol.md"
      - "docs/standards/**"
      - "docs/audits/**consensus*.md"
      - "docs/decisions/ADR-*.md"
    required_fields:
      - Changed Paths Checked
      - Disallowed Paths Present
      - Exemption Rationale
  trivial:
    max_files: 1
    allowed_globs:
      - "docs/**/*.md"
      - "*.md"
    denied_globs:
      - "Packages/**"
      - "SnapDrill/**"
      - "SnapDrillShare/**"
      - ".github/**"
      - ".claude/**"
      - "Scripts/**"
      - "*.xcodeproj/**"
      - "*.xcconfig"
      - ".swiftlint.yml"
      - "Package.swift"
      - "fastlane/**"
    required_fields:
      - Exemption Rationale

# 直推 develop / main 场景：commit msg 必须含 trailer
direct_push:
  commit_msg_trailer: "F-005-Review-Trace:"
  # commit msg 含此 trailer 即视为已留痕（trailer 后内容自由）
