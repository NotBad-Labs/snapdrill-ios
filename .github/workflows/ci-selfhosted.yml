name: NotBad CI/CD Pipeline (Self-hosted)

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      run_performance_tests:
        description: 'Run performance tests'
        required: false
        default: false
        type: boolean
      run_ui_tests:
        description: 'Run UI tests'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME_NAME: NotBad
  PROJECT_NAME: NotBad.xcodeproj
  WORKSPACE_PATH: NotBad.xcodeproj/project.xcworkspace
  # 使用群晖存储的artifacts目录
  ARTIFACTS_DIR: /Volumes/runner_data/artifacts
  # 缓存目录已在自托管运行器上配置
  CACHE_DIR: /Volumes/runner_data

jobs:
  # 代码质量检查 - 使用GitHub托管运行器（快速）
  code-quality:
    name: Code Quality & Linting
    runs-on: macos-15
    timeout-minutes: 10
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      
      - name: Cache SwiftLint
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/swiftlint
          key: swiftlint-${{ runner.os }}
      
      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi
      
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  # 单元测试和集成测试 - 使用自托管运行器
  test:
    name: Unit & Integration Tests
    runs-on: [self-hosted, macos, m4, xcode-16-4]
    timeout-minutes: 45
    needs: code-quality
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      matrix:
        destination:
          - 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.6'
          - 'platform=iOS Simulator,name=iPad (10th generation),OS=18.6'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # 验证Xcode版本（自托管运行器已预装）
      - name: Verify Xcode Version
        run: |
          xcode_version=$(xcodebuild -version | head -n 1)
          echo "当前Xcode版本: $xcode_version"
          if [[ ! "$xcode_version" =~ "Xcode 16.4" ]]; then
            echo "警告: 期望Xcode 16.4，当前版本: $xcode_version"
          fi
      
      # 验证存储挂载
      - name: Verify Storage Mount
        run: |
          if [ ! -d "/Volumes/runner_data" ]; then
            echo "错误: 群晖存储未挂载"
            exit 1
          fi
          echo "存储挂载正常: $(df -h /Volumes/runner_data | tail -1)"
      
      # 验证模拟器
      - name: Verify Simulators
        run: |
          echo "可用模拟器列表:"
          xcrun simctl list devices available | grep -E "(iPhone 16 Pro|iPad.*10th generation)"
      
      - name: Resolve Package Dependencies
        run: xcodebuild -resolvePackageDependencies -workspace ${{ env.WORKSPACE_PATH }} -scheme ${{ env.SCHEME_NAME }}
      
      - name: Build (for testing)
        run: |
          xcodebuild clean build \
            -workspace ${{ env.WORKSPACE_PATH }} \
            -scheme ${{ env.SCHEME_NAME }} \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -workspace ${{ env.WORKSPACE_PATH }} \
            -scheme ${{ env.SCHEME_NAME }} \
            -destination '${{ matrix.destination }}' \
            -testPlan UnitTestPlan \
            CODE_SIGNING_ALLOWED=NO \
            -enableCodeCoverage YES \
            -resultBundlePath ${{ env.ARTIFACTS_DIR }}/TestResults-${{ matrix.destination }}.xcresult
      
      - name: Run Integration Tests
        run: |
          xcodebuild test \
            -workspace ${{ env.WORKSPACE_PATH }} \
            -scheme ${{ env.SCHEME_NAME }} \
            -destination '${{ matrix.destination }}' \
            -testPlan IntegrationTestPlan \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath ${{ env.ARTIFACTS_DIR }}/IntegrationResults-${{ matrix.destination }}.xcresult
      
      - name: Generate Code Coverage Report
        run: |
          xcrun xccov view --report --json ${{ env.ARTIFACTS_DIR }}/TestResults-${{ matrix.destination }}.xcresult > ${{ env.ARTIFACTS_DIR }}/coverage-${{ matrix.destination }}.json
      
      - name: Check Code Coverage Threshold
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: python3 Scripts/check_coverage.py ${{ env.ARTIFACTS_DIR }}/coverage-${{ matrix.destination }}.json 80
      
      # 上传测试结果到群晖存储（作为备份）
      - name: Archive Test Results to NAS
        run: |
          timestamp=$(date +%Y%m%d_%H%M%S)
          mkdir -p ${{ env.CACHE_DIR }}/test-results/${{ github.run_number }}/${{ matrix.destination }}
          cp -r ${{ env.ARTIFACTS_DIR }}/TestResults-${{ matrix.destination }}.xcresult ${{ env.CACHE_DIR }}/test-results/${{ github.run_number }}/${{ matrix.destination }}/
          cp -r ${{ env.ARTIFACTS_DIR }}/IntegrationResults-${{ matrix.destination }}.xcresult ${{ env.CACHE_DIR }}/test-results/${{ github.run_number }}/${{ matrix.destination }}/
          cp ${{ env.ARTIFACTS_DIR }}/coverage-${{ matrix.destination }}.json ${{ env.CACHE_DIR }}/test-results/${{ github.run_number }}/${{ matrix.destination }}/
          echo "测试结果已保存到: ${{ env.CACHE_DIR }}/test-results/${{ github.run_number }}/${{ matrix.destination }}"

  # 性能测试 - 仅在PR或手动触发时运行
  performance-test:
    name: Performance Benchmarks
    runs-on: [self-hosted, macos, m4, xcode-16-4]
    timeout-minutes: 30
    needs: test
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main' && !contains(github.event.pull_request.title, "[skip perf]")) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_performance_tests == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Boot Simulator for Performance Tests
        run: |
          xcrun simctl boot "iPhone 16 Pro" || true
          sleep 10  # 等待模拟器完全启动
      
      - name: Run Performance Tests
        run: |
          xcodebuild test \
            -workspace ${{ env.WORKSPACE_PATH }} \
            -scheme ${{ env.SCHEME_NAME }} \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.6' \
            -testPlan PerformanceTestPlan \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath ${{ env.ARTIFACTS_DIR }}/PerformanceResults-${{ github.run_number }}.xcresult
      
      - name: Extract Performance Metrics
        run: python3 Scripts/extract_performance_metrics.py ${{ env.ARTIFACTS_DIR }}/PerformanceResults-${{ github.run_number }}.xcresult
      
      - name: Performance Regression Check
        run: python3 Scripts/check_performance_regression.py
      
      - name: Archive Performance Results to NAS
        run: |
          mkdir -p ${{ env.CACHE_DIR }}/performance-results/${{ github.run_number }}
          cp -r ${{ env.ARTIFACTS_DIR }}/PerformanceResults-${{ github.run_number }}.xcresult ${{ env.CACHE_DIR }}/performance-results/${{ github.run_number }}/

  # UI测试 - 仅在main分支或手动触发时运行
  ui-test:
    name: UI Tests
    runs-on: [self-hosted, macos, m4, xcode-16-4]
    timeout-minutes: 60
    needs: test
    if: |
      (github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, "[skip ci]")) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_ui_tests == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Boot Simulator for UI Tests
        run: |
          xcrun simctl boot "iPhone 16 Pro" || true
          sleep 10  # 等待模拟器完全启动
      
      - name: Run UI Tests
        run: |
          xcodebuild test \
            -workspace ${{ env.WORKSPACE_PATH }} \
            -scheme ${{ env.SCHEME_NAME }} \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.6' \
            -testPlan UITestPlan \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath ${{ env.ARTIFACTS_DIR }}/UITestResults-${{ github.run_number }}.xcresult
      
      - name: Archive UI Test Results to NAS
        run: |
          mkdir -p ${{ env.CACHE_DIR }}/ui-test-results/${{ github.run_number }}
          cp -r ${{ env.ARTIFACTS_DIR }}/UITestResults-${{ github.run_number }}.xcresult ${{ env.CACHE_DIR }}/ui-test-results/${{ github.run_number }}/

  # 构建和归档 - 仅在main分支运行
  build-archive:
    name: Build & Archive
    runs-on: [self-hosted, macos, m4, xcode-16-4]
    timeout-minutes: 45
    needs: [test, performance-test, ui-test]
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, "[skip ci]")
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      
      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
      
      - name: Archive Project
        run: |
          xcodebuild archive \
            -workspace ${{ env.WORKSPACE_PATH }} \
            -scheme ${{ env.SCHEME_NAME }} \
            -configuration Release \
            -archivePath ${{ env.ARTIFACTS_DIR }}/NotBad-${{ github.run_number }}.xcarchive \
            -allowProvisioningUpdates
      
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath ${{ env.ARTIFACTS_DIR }}/NotBad-${{ github.run_number }}.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath ${{ env.ARTIFACTS_DIR }}/export-${{ github.run_number }} \
            -allowProvisioningUpdates
      
      - name: Upload to TestFlight
        env:
          APPLEID_USERNAME: ${{ secrets.APPLEID_USERNAME }}
          APPLEID_PASSWORD: ${{ secrets.APPLEID_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file ${{ env.ARTIFACTS_DIR }}/export-${{ github.run_number }}/NotBad.ipa \
            --username "$APPLEID_USERNAME" \
            --password "$APPLEID_PASSWORD"
      
      - name: Archive Build Artifacts to NAS
        run: |
          mkdir -p ${{ env.CACHE_DIR }}/build-artifacts/${{ github.run_number }}
          cp -r ${{ env.ARTIFACTS_DIR }}/NotBad-${{ github.run_number }}.xcarchive ${{ env.CACHE_DIR }}/build-artifacts/${{ github.run_number }}/
          cp -r ${{ env.ARTIFACTS_DIR }}/export-${{ github.run_number }} ${{ env.CACHE_DIR }}/build-artifacts/${{ github.run_number }}/

  # 清理任务 - 定期清理旧文件
  cleanup:
    name: Cleanup Old Artifacts
    runs-on: [self-hosted, macos, m4, xcode-16-4]
    needs: [build-archive]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Cleanup Old Artifacts
        run: |
          # 清理30天前的测试结果
          find ${{ env.CACHE_DIR }}/test-results -type d -mtime +30 -exec rm -rf {} + 2>/dev/null || true
          
          # 清理30天前的性能测试结果
          find ${{ env.CACHE_DIR }}/performance-results -type d -mtime +30 -exec rm -rf {} + 2>/dev/null || true
          
          # 清理30天前的UI测试结果
          find ${{ env.CACHE_DIR }}/ui-test-results -type d -mtime +30 -exec rm -rf {} + 2>/dev/null || true
          
          # 清理60天前的构建产物（保留更长时间）
          find ${{ env.CACHE_DIR }}/build-artifacts -type d -mtime +60 -exec rm -rf {} + 2>/dev/null || true
          
          echo "清理完成，释放空间: $(df -h ${{ env.CACHE_DIR }} | tail -1)"

  # 通知任务
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [build-archive, cleanup]
    if: always() && secrets.SLACK_WEBHOOK_URL != ''
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          status: ${{ job.status }}
          channel: '#notbad-dev'
          fields: repo,message,commit,author,action,eventName,ref,workflow
