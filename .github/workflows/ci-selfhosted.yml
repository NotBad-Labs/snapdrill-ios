# NOTE: Versions, environments, and constraints must follow the PRD (SSoT):
# docs/prd/NotBad 错题本 App - 产品需求文档 (PRD) v6.0 (Swift6.2 + iOS26).md
name: NotBad CI/CD Pipeline (Self-hosted)

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      run_performance_tests:
        description: 'Run performance tests'
        required: false
        default: false
        type: boolean
      run_ui_tests:
        description: 'Run UI tests'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME_NAME: NotBad
  PROJECT_NAME: NotBad.xcodeproj
  WORKSPACE_PATH: NotBad.xcodeproj/project.xcworkspace
  # Mount under $HOME to avoid sudo/password prompts
  ARTIFACTS_DIR: $HOME/runner_data/artifacts
  CACHE_DIR: $HOME/runner_data
  # Synology/NAS secrets
  SMB_HOST: ${{ secrets.SMB_HOST }}
  SHARE_NAME: ${{ secrets.SHARE_NAME }}
  SMB_USER: ${{ secrets.SMB_USER }}
  SMB_PASSWORD: ${{ secrets.SMB_PASSWORD }}
  SYNOLOGY_HOSTNAME: DS1821

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: macos-15
    timeout-minutes: 15
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging || true

  test:
    name: Unit & Integration Tests
    runs-on: [self-hosted, macos, m4, xcode-16-4]
    timeout-minutes: 60
    needs: code-quality
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    strategy:
      matrix:
        destination:
          - 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.6'
          - 'platform=iOS Simulator,name=iPad Pro 11-inch (M4),OS=18.6'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Mount Synology Storage (no sudo)
        run: |
          set -euo pipefail
          MOUNT_POINT="$HOME/runner_data"
          if [ -d "$MOUNT_POINT" ] && mount | grep -q "$MOUNT_POINT"; then
            echo "✅ 已挂载: $MOUNT_POINT"
          else
            echo "挂载 NAS 到: $MOUNT_POINT"
            # Resolve host via mDNS first
            if nslookup "${SYNOLOGY_HOSTNAME}.local" > /dev/null 2>&1; then
              ACTUAL_HOST="${SYNOLOGY_HOSTNAME}.local"
            else
              ACTUAL_HOST="${SMB_HOST}"
            fi
            mkdir -p "$MOUNT_POINT"
            # URL-encode password to handle special characters
            ENCODED_PWD=$(python3 -c "import os,urllib.parse;print(urllib.parse.quote(os.environ.get('SMB_PASSWORD',''), safe=''))")
            CRED_URL="//${SMB_USER}:${ENCODED_PWD}@${ACTUAL_HOST}/${SHARE_NAME}"
            if mount_smbfs -o file_mode=0777,dir_mode=0777 "$CRED_URL" "$MOUNT_POINT"; then
              echo "✅ 挂载成功"
              mkdir -p "$MOUNT_POINT/artifacts" "$MOUNT_POINT/test-results" "$MOUNT_POINT/performance-results" "$MOUNT_POINT/ui-test-results" "$MOUNT_POINT/build-artifacts"
            else
              echo "❌ 挂载失败"
              exit 1
            fi
          fi
          df -h "$MOUNT_POINT" | tail -1

      - name: Prepare artifacts directory
        run: mkdir -p "${{ env.ARTIFACTS_DIR }}"

      - name: Build (for testing)
        run: |
          xcodebuild clean build \
            -workspace ${{ env.WORKSPACE_PATH }} \
            -scheme ${{ env.SCHEME_NAME }} \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Unit Tests
        run: |
          local_result_path="./TestResults-$(date +%s).xcresult"
          xcodebuild test \
            -workspace ${{ env.WORKSPACE_PATH }} \
            -scheme ${{ env.SCHEME_NAME }} \
            -destination "${{ matrix.destination }}" \
            -testPlan UnitTestPlan \
            CODE_SIGNING_ALLOWED=NO \
            -enableCodeCoverage YES \
            -resultBundlePath "$local_result_path"
          cp -r "$local_result_path" "${{ env.ARTIFACTS_DIR }}/TestResults-${{ matrix.destination }}.xcresult"

      - name: Run Integration Tests
        run: |
          local_result_path="./IntegrationResults-$(date +%s).xcresult"
          xcodebuild test \
            -workspace ${{ env.WORKSPACE_PATH }} \
            -scheme ${{ env.SCHEME_NAME }} \
            -destination "${{ matrix.destination }}" \
            -testPlan IntegrationTestPlan \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$local_result_path"
          cp -r "$local_result_path" "${{ env.ARTIFACTS_DIR }}/IntegrationResults-${{ matrix.destination }}.xcresult"

      - name: Generate coverage json
        run: |
          xcrun xccov view --report --json "${{ env.ARTIFACTS_DIR }}/TestResults-${{ matrix.destination }}.xcresult" > "${{ env.ARTIFACTS_DIR }}/coverage-${{ matrix.destination }}.json"

      - name: Archive results to NAS cache
        run: |
          safe_dest=$(echo "${{ matrix.destination }}" | sed 's/[^a-zA-Z0-9._-]/_/g')
          mkdir -p "${{ env.CACHE_DIR }}/test-results/${{ github.run_number }}/$safe_dest"
          cp -r "${{ env.ARTIFACTS_DIR }}/TestResults-${{ matrix.destination }}.xcresult" "${{ env.CACHE_DIR }}/test-results/${{ github.run_number }}/$safe_dest/" || true
          cp -r "${{ env.ARTIFACTS_DIR }}/IntegrationResults-${{ matrix.destination }}.xcresult" "${{ env.CACHE_DIR }}/test-results/${{ github.run_number }}/$safe_dest/" || true
          cp "${{ env.ARTIFACTS_DIR }}/coverage-${{ matrix.destination }}.json" "${{ env.CACHE_DIR }}/test-results/${{ github.run_number }}/$safe_dest/" || true
