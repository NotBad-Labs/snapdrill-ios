name: Release Metadata Check

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
    types: [opened, synchronize, reopened]

    # Only run for PRs from release/** or hotfix/** branches
    # GitHub Actions doesn't support PR source filters directly; we'll filter in a job step.

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags and history for changelog generation

      - name: Ensure Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Skip if not from release/* or hotfix/*
        id: branch_check
        run: |
          set -euo pipefail
          SRC_REF="${{ github.head_ref }}"
          echo "Source ref: $SRC_REF"
          if [[ "$SRC_REF" == release/* || "$SRC_REF" == hotfix/* ]]; then
            echo "run_check=true" >> $GITHUB_OUTPUT
          else
            echo "run_check=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate release metadata
        if: steps.branch_check.outputs.run_check == 'true'
        run: |
          python3 Scripts/validate_release_metadata.py

      - name: Determine previous tag
        if: steps.branch_check.outputs.run_check == 'true'
        id: prev
        run: |
          set -euo pipefail
          # Try to find the latest tag reachable from base branch (main)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "Latest tag: ${LATEST_TAG}"

      - name: Generate changelog snippet from git
        if: steps.branch_check.outputs.run_check == 'true'
        run: |
          set -euo pipefail
          if [ -n "${{ steps.prev.outputs.latest_tag }}" ]; then
            python3 Scripts/generate_changelog_from_git.py --from "${{ steps.prev.outputs.latest_tag }}" --to HEAD > changelog_snippet.md
          else
            # No tags found, use last 200 commits as a fallback
            git --no-pager log --pretty=format:%s -n 200 > /tmp/commits.txt
            echo "### Changes (last 200 commits)\n" > changelog_snippet.md
            while IFS= read -r line; do echo "- $line" >> changelog_snippet.md; done < /tmp/commits.txt
          fi

      - name: Upload changelog snippet artifact
        if: steps.branch_check.outputs.run_check == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changelog-snippet
          path: changelog_snippet.md
