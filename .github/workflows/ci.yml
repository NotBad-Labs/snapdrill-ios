name: SnapDrill CI

on:
  # 只在 PR 时自动触发（减少不必要的排队）
  pull_request:
    branches: [ "develop", "main" ]
  # 手动触发
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    # 使用 Mac mini 自托管 runner（离线时任务排队等待，免费）
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # 自动检测已安装的 Xcode，优先最新版
        run: |
          if [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          else
            echo "Using default Xcode: $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Check SwiftLint
        run: |
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$PATH"
          if ! which swiftlint > /dev/null; then
            brew install swiftlint
          fi
          swiftlint version

      - name: Lint
        run: swiftlint --strict

      - name: Build
        run: |
          xcodebuild build \
            -scheme SnapDrill \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Test
        run: |
          xcodebuild test \
            -scheme SnapDrill \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -resultBundlePath TestResults \
            -enableCodeCoverage YES \
            -skip-testing:SnapDrillUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Check Code Coverage
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json

          COVERAGE=$(python3 -c "import json; data=json.load(open('coverage.json')); print(data['lineCoverage']*100)")

          echo "📊 Code Coverage: ${COVERAGE}%"

          MIN_COVERAGE=70
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below minimum ${MIN_COVERAGE}%"
            echo "::error::Code coverage is below the minimum threshold"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets minimum ${MIN_COVERAGE}%"
          fi

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
