name: SnapDrill CI

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "develop", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        # Swift 6.3 toolchain 需要 Xcode 26.4+
        run: |
          if [ -d "/Applications/Xcode_26.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.app
          fi
          XCODE_VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          XCODE_MAJOR=$(echo "$XCODE_VER" | cut -d. -f1)
          XCODE_MINOR=$(echo "$XCODE_VER" | cut -d. -f2)
          if [ "$XCODE_MAJOR" -lt 26 ] || { [ "$XCODE_MAJOR" -eq 26 ] && [ "$XCODE_MINOR" -lt 4 ]; }; then
            echo "ERROR: Xcode 26.4+ required（Swift 6.3 toolchain），当前 = $XCODE_VER"
            exit 1
          fi
          xcodebuild -version

      - name: Check SwiftLint
        run: |
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$PATH"
          if ! which swiftlint > /dev/null; then
            brew install swiftlint
          fi
          swiftlint version

      - name: Lint
        run: swiftlint --strict

      - name: Validate docs
        run: |
          python3 -m unittest discover -s Scripts/tests
          python3 Scripts/generate_feature_status.py --check
          python3 Scripts/generate_intent_traceability.py --check
          python3 Scripts/test_doc_generators.py
          python3 Scripts/validate_docs.py --check
          python3 Scripts/validate_capture_contract.py --check

      - name: Check Package Dependencies
        run: |
          echo "Checking for reverse dependency violations..."
          VIOLATIONS=0
          # Core 不应该 import 任何下游包
          if grep -rn --include='*.swift' 'import SnapDrillData\|import SnapDrillUI\|import SnapDrillFeatures' Packages/SnapDrillCore/Sources/ 2>/dev/null; then
            echo "ERROR: Core must not import downstream packages"
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          if grep -rn --include='*.swift' 'import SnapDrillUI\|import SnapDrillFeatures' Packages/SnapDrillData/Sources/ 2>/dev/null; then
            echo "ERROR: Data must only import Core"
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          if grep -rn --include='*.swift' 'import SnapDrillData\|import SnapDrillFeatures' Packages/SnapDrillUI/Sources/ 2>/dev/null; then
            echo "ERROR: UI must only import Core"
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          # SnapDrillInfrastructure 包已退役（Firebase 剔除 RC-1/2/6）→ 相关反向依赖门禁移除
          if grep -rn --include='*.swift' '^import SnapDrill' SnapDrillShare/ 2>/dev/null; then
            echo "ERROR: Share Extension must not import SnapDrill packages"
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          if [ $VIOLATIONS -gt 0 ]; then
            echo "Found $VIOLATIONS dependency direction violation(s)"
            exit 1
          fi
          echo "All package dependency directions are correct"

      - name: Clean Simulator
        # 清理模拟器残留 SwiftData schema，避免 ModelContainer 初始化死锁
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 17" | head -1 | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          if [ -n "$DEVICE_ID" ]; then
            xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
            xcrun simctl erase "$DEVICE_ID"
            echo "Simulator $DEVICE_ID erased"
          fi

      - name: Validate test plan JSON
        run: |
          PLAN=SnapDrill.xcodeproj/xcshareddata/xctestplans/AllTests.xctestplan
          python3 -c "import json, sys; json.load(open('$PLAN'))" && echo "xctestplan JSON OK"

      - name: Prime SPM cache (resilient)
        # 大型 C++ 子模块（abseil / protobuf，经 Firebase 间接拉）clone 易断流/挂起：
        # 短低速超时让 stall 快速 abort，重试解析灌入 workspace 外持久缓存（成功一次后跨 run 复用）
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          for i in 1 2 3 4 5 6; do
            xcodebuild -resolvePackageDependencies \
              -scheme AllTests \
              -clonedSourcePackagesDirPath "$HOME/.spm-cache/snapdrill" && break
            echo "::warning::SPM resolve attempt $i failed, retrying in 15s..."
            sleep 15
          done
          # 最终校验：仍失败则整步失败，避免带半缓存进 build
          xcodebuild -resolvePackageDependencies \
            -scheme AllTests \
            -clonedSourcePackagesDirPath "$HOME/.spm-cache/snapdrill"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -scheme AllTests \
            -testPlan AllTests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            -clonedSourcePackagesDirPath "$HOME/.spm-cache/snapdrill" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Test without building
        run: |
          rm -rf TestResults.xcresult
          XCTESTRUN_PATH=$(find "$GITHUB_WORKSPACE/DerivedData/Build/Products" -name "AllTests_*.xctestrun" | head -1)
          if [ -z "$XCTESTRUN_PATH" ] || [ ! -f "$XCTESTRUN_PATH" ]; then
            echo "::error::xctestrun not found under DerivedData/Build/Products/AllTests_*.xctestrun"
            ls -la "$GITHUB_WORKSPACE/DerivedData/Build/Products" || true
            exit 1
          fi
          echo "Using xctestrun: $XCTESTRUN_PATH"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN_PATH" \
            -only-test-configuration CI \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 失败诊断：self-hosted runner 本地 DerivedData/TestResults.xcresult 已留存
      # 直接 ssh 到 runner 查看即可，无需上传回 GitHub（曾耗尽 0.5GB Actions 存储配额）

  ui-tests:
    name: UI Tests (develop only)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    # app 级 XCUITest（驱动真 app UI）慢且对模拟器生命周期敏感，不进每-PR 门禁；
    # 仅在 develop 合并（push）或手动触发时跑，且 needs:build → 单测/lint 过了才跑。
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_26.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.app
          fi
          xcodebuild -version

      - name: Clean & boot simulator
        # 清理残留 SwiftData schema + 预启动并等 SpringBoard 就绪：
        # 单 runner 上 build job 刚跑完模拟器会话，紧接 UI 测试常撞 CoreSimulator "Busy"
        # （FBSOpenApplicationErrorDomain Code=6 preflight 失败）→ 显式 boot + bootstatus -b
        # 阻塞到设备完全就绪，消除 XCUITest runner 冷启动竞态；DEVICE_ID 传后续步骤复用
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 17" | head -1 | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone 17 simulator found"
            exit 1
          fi
          xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl erase "$DEVICE_ID"
          echo "Simulator $DEVICE_ID erased; booting and waiting for ready..."
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "Simulator $DEVICE_ID booted and ready"

      - name: Validate UI test plan JSON
        run: |
          PLAN=SnapDrill.xcodeproj/xcshareddata/xctestplans/UITests.xctestplan
          python3 -c "import json, sys; json.load(open('$PLAN'))" && echo "UITests xctestplan JSON OK"

      - name: Prime SPM cache (resilient)
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          for i in 1 2 3 4 5 6; do
            xcodebuild -resolvePackageDependencies \
              -scheme SnapDrill \
              -clonedSourcePackagesDirPath "$HOME/.spm-cache/snapdrill" && break
            echo "::warning::SPM resolve attempt $i failed, retrying in 15s..."
            sleep 15
          done
          xcodebuild -resolvePackageDependencies \
            -scheme SnapDrill \
            -clonedSourcePackagesDirPath "$HOME/.spm-cache/snapdrill"

      - name: Build for testing (UI)
        run: |
          xcodebuild build-for-testing \
            -scheme SnapDrill \
            -testPlan UITests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedDataUI" \
            -clonedSourcePackagesDirPath "$HOME/.spm-cache/snapdrill" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Test without building (UI)
        run: |
          # 产物命名 = <scheme>_<testPlan>_*.xctestrun（实证：SnapDrill_UITests_*）
          XCTESTRUN_PATH=$(find "$GITHUB_WORKSPACE/DerivedDataUI/Build/Products" -name "SnapDrill_UITests_*.xctestrun" | head -1)
          if [ -z "$XCTESTRUN_PATH" ] || [ ! -f "$XCTESTRUN_PATH" ]; then
            echo "::error::UI xctestrun not found under DerivedDataUI/Build/Products/SnapDrill_UITests_*.xctestrun"
            ls -la "$GITHUB_WORKSPACE/DerivedDataUI/Build/Products" || true
            exit 1
          fi
          echo "Using xctestrun: $XCTESTRUN_PATH on device $DEVICE_ID"
          # XCUITest runner 启动偶发撞模拟器 "Busy"（preflight 失败）= 基建 flake 非测试失败；
          # 重试最多 3 次，每次失败后重启模拟器并等就绪，吸收瞬态启动竞态
          attempt=1
          max=3
          while :; do
            rm -rf UITestResults.xcresult
            xcodebuild test-without-building \
              -xctestrun "$XCTESTRUN_PATH" \
              -only-test-configuration CI \
              -destination "platform=iOS Simulator,id=$DEVICE_ID" \
              -parallel-testing-enabled NO \
              -resultBundlePath UITestResults.xcresult \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" && break
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::UI tests failed after $max attempts"
              exit 65
            fi
            echo "::warning::UI test attempt $attempt failed (likely simulator launch flake), rebooting simulator and retrying..."
            xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
            xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
            xcrun simctl bootstatus "$DEVICE_ID" -b || true
            sleep 10
            attempt=$((attempt+1))
          done
