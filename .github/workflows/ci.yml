name: SnapDrill CI

on:
  # 只在 PR 时自动触发（减少不必要的排队）
  pull_request:
    branches: [ "develop", "main" ]
  # 手动触发
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    # 使用 Mac mini 自托管 runner（离线时任务排队等待，免费）
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # 自动检测已安装的 Xcode，优先最新版
        run: |
          if [ -d "/Applications/Xcode_26.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.app
          elif [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          else
            echo "Using default Xcode: $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Check SwiftLint
        run: |
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$PATH"
          if ! which swiftlint > /dev/null; then
            brew install swiftlint
          fi
          swiftlint version

      - name: Lint
        run: swiftlint --strict

      - name: Check Package Dependencies
        run: |
          echo "Checking for reverse dependency violations..."
          VIOLATIONS=0
          # Core 不应该 import 任何下游包
          if grep -rn --include='*.swift' 'import SnapDrillData\|import SnapDrillUI\|import SnapDrillFeatures\|import SnapDrillInfrastructure' Packages/SnapDrillCore/Sources/ 2>/dev/null; then
            echo "ERROR: Core must not import downstream packages"
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          # Data 只能 import Core
          if grep -rn --include='*.swift' 'import SnapDrillUI\|import SnapDrillFeatures\|import SnapDrillInfrastructure' Packages/SnapDrillData/Sources/ 2>/dev/null; then
            echo "ERROR: Data must only import Core"
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          # UI 只能 import Core
          if grep -rn --include='*.swift' 'import SnapDrillData\|import SnapDrillFeatures\|import SnapDrillInfrastructure' Packages/SnapDrillUI/Sources/ 2>/dev/null; then
            echo "ERROR: UI must only import Core"
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          # Infrastructure 只能 import Core
          if grep -rn --include='*.swift' 'import SnapDrillData\|import SnapDrillUI\|import SnapDrillFeatures' Packages/SnapDrillInfrastructure/Sources/ 2>/dev/null; then
            echo "ERROR: Infrastructure must only import Core"
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          # Features 不应该 import Infrastructure
          if grep -rn --include='*.swift' 'import SnapDrillInfrastructure' Packages/SnapDrillFeatures/Sources/ 2>/dev/null; then
            echo "ERROR: Features must not import Infrastructure directly"
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          if [ $VIOLATIONS -gt 0 ]; then
            echo "Found $VIOLATIONS dependency direction violation(s)"
            exit 1
          fi
          echo "All package dependency directions are correct"

      - name: Clean Simulator
        # 清理模拟器残留的 SwiftData schema 和 App 数据，
        # 避免 ModelContainer 初始化死锁（GradeRepository 稳定挂起）
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 17" | head -1 | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          if [ -n "$DEVICE_ID" ]; then
            xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
            xcrun simctl erase "$DEVICE_ID"
            echo "Simulator $DEVICE_ID erased"
          fi

      - name: Build
        # build-for-testing 比 build 更严格——会编译测试 target
        run: |
          xcodebuild build-for-testing \
            -scheme SnapDrill \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Test
        # AllTests scheme 包含 Core + Data + Features 全部测试 target
        # -parallel-testing-enabled NO：避免跨 suite 并行执行时 ModelContainer 竞态
        run: |
          xcodebuild test \
            -scheme AllTests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
