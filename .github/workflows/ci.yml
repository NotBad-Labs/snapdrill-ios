name: SnapDrill CI

on:
  # 只在 PR 时自动触发（减少不必要的排队）
  pull_request:
    branches: [ "develop", "main" ]
  # 手动触发
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    # 使用 Mac mini 自托管 runner（离线时任务排队等待，免费）
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # 自动检测已安装的 Xcode，优先最新版
        run: |
          if [ -d "/Applications/Xcode_26.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.app
          elif [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          else
            echo "Using default Xcode: $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Check SwiftLint
        run: |
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$PATH"
          if ! which swiftlint > /dev/null; then
            brew install swiftlint
          fi
          swiftlint version

      - name: Lint
        run: swiftlint --strict

      - name: Build
        # build-for-testing 比 build 更严格——会编译测试 target
        run: |
          xcodebuild build-for-testing \
            -scheme SnapDrill \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Test
        # SnapDrillFeaturesTests 是唯一配有 test action 的自动生成 scheme
        # SnapDrillCore/Data 的库 scheme 无 test action，其测试编译由 build-for-testing 保证
        # TODO: 在 Xcode 中创建包含全部测试 target 的 shared scheme，提交到 git
        # -parallel-testing-enabled NO：避免跨 suite 并行执行时 ModelContainer 竞态
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SnapDrillFeaturesTests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee /tmp/snapdrill-ci-test.log

          # 防止“0 tests”假绿灯：至少要执行 1 个测试用例
          if ! grep -Eq "Executed [1-9][0-9]* tests" /tmp/snapdrill-ci-test.log; then
            echo "ERROR: xcodebuild test executed 0 tests. Failing CI intentionally."
            exit 1
          fi
