# .github/workflows/ci.yml
name: NotBad CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # 允许手动触发

env:
  DEVELOPER_DIR: /Applications/Xcode_15.0.app/Contents/Developer
  SCHEME_NAME: NotBad
  PROJECT_NAME: NotBad.xcodeproj

jobs:
  # 代码质量检查
  code-quality:
    name: Code Quality & Linting
    runs-on: macos-14
    timeout-minutes: 15
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
        
    - name: Cache SwiftLint
      uses: actions/cache@v3
      with:
        path: /usr/local/bin/swiftlint
        key: swiftlint-${{ runner.os }}
        
    - name: Install SwiftLint
      run: |
        if ! command -v swiftlint &> /dev/null; then
          brew install swiftlint
        fi
        
    - name: Run SwiftLint
      run: |
        swiftlint lint --reporter github-actions-logging
        
    - name: Check Swift Format
      run: |
        # 如果项目使用 swift-format
        # swift-format lint --recursive Sources/ Tests/
        echo "Swift format check completed"

  # 单元测试和集成测试
  test:
    name: Unit & Integration Tests
    runs-on: macos-14
    timeout-minutes: 30
    needs: code-quality
    
    strategy:
      matrix:
        # 测试多个iOS版本
        destination:
          - 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.0'
          - 'platform=iOS Simulator,name=iPad Pro (12.9-inch) (6th generation),OS=17.0'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
        
    - name: Cache Dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/.cache/org.swift.swiftpm
        key: ${{ runner.os }}-xcode-${{ hashFiles('**/*.xcodeproj', '**/*.swift') }}
        restore-keys: |
          ${{ runner.os }}-xcode-
          
    - name: Build Project
      run: |
        xcodebuild clean build \
          -project ${{ env.PROJECT_NAME }} \
          -scheme ${{ env.SCHEME_NAME }} \
          -destination '${{ matrix.destination }}' \
          CODE_SIGNING_ALLOWED=NO
          
    - name: Run Unit Tests
      run: |
        xcodebuild test \
          -project ${{ env.PROJECT_NAME }} \
          -scheme ${{ env.SCHEME_NAME }} \
          -destination '${{ matrix.destination }}' \
          -testPlan UnitTestPlan \
          CODE_SIGNING_ALLOWED=NO \
          -enableCodeCoverage YES \
          -resultBundlePath TestResults.xcresult
          
    - name: Run Integration Tests
      run: |
        xcodebuild test \
          -project ${{ env.PROJECT_NAME }} \
          -scheme ${{ env.SCHEME_NAME }} \
          -destination '${{ matrix.destination }}' \
          -testPlan IntegrationTestPlan \
          CODE_SIGNING_ALLOWED=NO \
          -resultBundlePath IntegrationResults.xcresult
          
    - name: Generate Code Coverage Report
      run: |
        xcrun xccov view --report --json TestResults.xcresult > coverage.json
        
    - name: Check Code Coverage Threshold
      run: |
        # 检查代码覆盖率是否达到80%
        python3 Scripts/check_coverage.py coverage.json 80
        
    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.destination }}
        path: |
          TestResults.xcresult
          IntegrationResults.xcresult
          coverage.json

  # 性能基准测试
  performance-test:
    name: Performance Benchmarks
    runs-on: macos-14
    timeout-minutes: 20
    needs: test
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
        
    - name: Run Performance Tests
      run: |
        xcodebuild test \
          -project ${{ env.PROJECT_NAME }} \
          -scheme ${{ env.SCHEME_NAME }} \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.0' \
          -testPlan PerformanceTestPlan \
          CODE_SIGNING_ALLOWED=NO \
          -resultBundlePath PerformanceResults.xcresult
          
    - name: Extract Performance Metrics
      run: |
        # 提取性能指标并与基线对比
        python3 Scripts/extract_performance_metrics.py PerformanceResults.xcresult
        
    - name: Performance Regression Check
      run: |
        # 检查是否有性能回退（超过10%）
        python3 Scripts/check_performance_regression.py
        
    - name: Upload Performance Results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: PerformanceResults.xcresult

  # UI测试
  ui-test:
    name: UI Tests
    runs-on: macos-14
    timeout-minutes: 45
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
        
    - name: Boot Simulator
      run: |
        # 预启动模拟器以加速测试
        xcrun simctl boot "iPhone 15 Pro" || true
        
    - name: Run UI Tests
      run: |
        xcodebuild test \
          -project ${{ env.PROJECT_NAME }} \
          -scheme ${{ env.SCHEME_NAME }} \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.0' \
          -testPlan UITestPlan \
          CODE_SIGNING_ALLOWED=NO \
          -resultBundlePath UITestResults.xcresult
          
    - name: Upload UI Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: ui-test-results
        path: UITestResults.xcresult

  # 构建和打包
  build-archive:
    name: Build & Archive
    runs-on: macos-14
    timeout-minutes: 30
    needs: [test, performance-test, ui-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
        
    - name: Install Apple Certificate
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # 创建临时keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        
        # 导入证书
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o certificate.p12
        security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        
    - name: Install Provisioning Profile
      env:
        PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      run: |
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
        
    - name: Archive Project
      run: |
        xcodebuild archive \
          -project ${{ env.PROJECT_NAME }} \
          -scheme ${{ env.SCHEME_NAME }} \
          -configuration Release \
          -archivePath NotBad.xcarchive \
          -allowProvisioningUpdates
          
    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath NotBad.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath export \
          -allowProvisioningUpdates
          
    - name: Upload to TestFlight
      env:
        APPLEID_USERNAME: ${{ secrets.APPLEID_USERNAME }}
        APPLEID_PASSWORD: ${{ secrets.APPLEID_PASSWORD }}
      run: |
        xcrun altool --upload-app \
          --type ios \
          --file export/NotBad.ipa \
          --username "$APPLEID_USERNAME" \
          --password "$APPLEID_PASSWORD"
          
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: |
          NotBad.xcarchive
          export/

  # 部署通知
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: build-archive
    if: always()
    
    steps:
    - name: Notify Slack
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#notbad-dev'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
