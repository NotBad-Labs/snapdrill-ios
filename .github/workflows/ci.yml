# NotBad CI/CD Pipeline
# 使用自托管 Mac mini M4 Runner 进行 iOS 构建和测试
# 
# 配置说明：
# - Runner 标签: self-hosted, macOS, ARM64
# - Xcode: 26.1.1
# - Swift: 6.2.1
# - 目标平台: iOS 18.0+

name: CI

on:
  push:
    branches: [main, minimal]
  pull_request:
    branches: [main, minimal]
  workflow_dispatch:  # 允许手动触发

# 确保同一分支只有一个工作流在运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: NotBad
  DESTINATION: 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.1'
  XCODE_VERSION: '16.1'

jobs:
  # ============================================
  # 代码质量检查
  # ============================================
  lint:
    name: 🔍 SwiftLint
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run SwiftLint
        run: |
          if command -v swiftlint &> /dev/null; then
            swiftlint lint --reporter github-actions-logging
          else
            echo "⚠️ SwiftLint not installed, skipping..."
          fi

  # ============================================
  # 构建
  # ============================================
  build:
    name: 🔨 Build
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Show Xcode Version
        run: xcodebuild -version
      
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project NotBad.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -destination "${{ env.DESTINATION }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color || true

  # ============================================
  # 单元测试
  # ============================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: [self-hosted, macOS, ARM64]
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run Unit Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project NotBad.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -destination "${{ env.DESTINATION }}" \
            -testPlan UnitTestPlan \
            -resultBundlePath TestResults/UnitTests.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --test || true
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/
          retention-days: 7

  # ============================================
  # UI 测试
  # ============================================
  ui-tests:
    name: 📱 UI Tests
    runs-on: [self-hosted, macOS, ARM64]
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run UI Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project NotBad.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -destination "${{ env.DESTINATION }}" \
            -testPlan UITestPlan \
            -resultBundlePath TestResults/UITests.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --test || true
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: TestResults/
          retention-days: 7

  # ============================================
  # 测试覆盖率报告
  # ============================================
  coverage:
    name: 📊 Coverage Report
    runs-on: [self-hosted, macOS, ARM64]
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Generate Coverage
        run: |
          set -o pipefail
          xcodebuild test \
            -project NotBad.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -destination "${{ env.DESTINATION }}" \
            -testPlan UnitTestPlan \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/Coverage.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color || true
      
      - name: Extract Coverage Report
        run: |
          xcrun xccov view --report TestResults/Coverage.xcresult --json > coverage.json || true
          echo "## 📊 Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.json ]; then
            # 提取总覆盖率
            COVERAGE=$(cat coverage.json | python3 -c "import sys, json; data=json.load(sys.stdin); print(f\"{data.get('lineCoverage', 0) * 100:.1f}%\")" 2>/dev/null || echo "N/A")
            echo "**Total Coverage:** $COVERAGE" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # 构建状态汇总
  # ============================================
  status:
    name: ✅ CI Status
    runs-on: [self-hosted, macOS, ARM64]
    needs: [lint, build, unit-tests, ui-tests]
    if: always()
    steps:
      - name: Check Status
        run: |
          echo "## 🎯 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SwiftLint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI Tests | ${{ needs.ui-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.build.result }}" == "failure" || "${{ needs.unit-tests.result }}" == "failure" ]]; then
            echo ""
            echo "❌ **Pipeline Failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo ""
            echo "✅ **Pipeline Passed**" >> $GITHUB_STEP_SUMMARY
          fi
