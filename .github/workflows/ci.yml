name: SnapDrill CI

on:
  # 只在 PR 时自动触发（减少不必要的排队）
  pull_request:
    branches: [ "develop", "main" ]
  # 手动触发
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    # 使用 Mac mini 自托管 runner（离线时任务排队等待，免费）
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # 自动检测已安装的 Xcode，优先最新版
        run: |
          if [ -d "/Applications/Xcode_26.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.app
          elif [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          else
            echo "Using default Xcode: $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Check SwiftLint
        run: |
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$PATH"
          if ! which swiftlint > /dev/null; then
            brew install swiftlint
          fi
          swiftlint version

      - name: Lint
        run: swiftlint --strict

      - name: Build
        # build-for-testing 比 build 更严格——会编译测试 target
        run: |
          xcodebuild build-for-testing \
            -scheme SnapDrill \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Test
        # AllTests scheme 包含 Core + Data + Features 全部测试 target
        # -parallel-testing-enabled NO：避免跨 suite 并行执行时 ModelContainer 竞态
        run: |
          xcodebuild test \
            -scheme AllTests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
