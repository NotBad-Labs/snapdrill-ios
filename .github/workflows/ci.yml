name: SnapDrill CI

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "develop", "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR pushes cancel stale same-ref runs; develop/main push and manual dispatch preserve signal.
  # This keeps the self-hosted queue short without hiding post-merge signal.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Verify checkout identity
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checkout HEAD does not match GITHUB_SHA"
            exit 1
          fi
          echo "Checkout identity: $GITHUB_SHA"

      - name: Validate exact toolchain
        run: |
          export PATH="$HOME/bin:$PATH"
          printf '%s\n' "$HOME/bin" >> "$GITHUB_PATH"
          python3 Scripts/ci_github.py toolchain \
            --config Configs/Toolchain.env \
            --github-env "$GITHUB_ENV"

      - name: Lint
        run: swiftlint --strict

      - name: Validate docs
        run: |
          python3 -m unittest discover -s Scripts/tests
          python3 Scripts/generate_feature_status.py --check
          python3 Scripts/generate_intent_traceability.py --check
          python3 Scripts/test_doc_generators.py
          python3 Scripts/validate_docs.py --check
          python3 Scripts/validate_capture_contract.py --check

      - name: Check Package Dependencies
        run: |
          echo "Checking for reverse dependency violations..."
          VIOLATIONS=0
          # Core 不应该 import 任何下游包
          if grep -rn --include='*.swift' 'import SnapDrillData\|import SnapDrillUI\|import SnapDrillFeatures' Packages/SnapDrillCore/Sources/ 2>/dev/null; then
            echo "ERROR: Core must not import downstream packages"
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          if grep -rn --include='*.swift' 'import SnapDrillUI\|import SnapDrillFeatures' Packages/SnapDrillData/Sources/ 2>/dev/null; then
            echo "ERROR: Data must only import Core"
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          if grep -rn --include='*.swift' 'import SnapDrillData\|import SnapDrillFeatures' Packages/SnapDrillUI/Sources/ 2>/dev/null; then
            echo "ERROR: UI must only import Core"
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          # SnapDrillInfrastructure 包已退役（Firebase 剔除 RC-1/2/6）→ 相关反向依赖门禁移除
          if grep -rn --include='*.swift' '^import SnapDrill' SnapDrillShare/ 2>/dev/null; then
            echo "ERROR: Share Extension must not import SnapDrill packages"
            VIOLATIONS=$((VIOLATIONS+1))
          fi
          if [ $VIOLATIONS -gt 0 ]; then
            echo "Found $VIOLATIONS dependency direction violation(s)"
            exit 1
          fi
          echo "All package dependency directions are correct"

      - name: Resolve exact simulator
        id: simulator
        run: |
          INVENTORY="$RUNNER_TEMP/snapdrill-simctl-${GITHUB_RUN_ID}-${GITHUB_JOB}.json"
          xcrun simctl list devices available -j > "$INVENTORY"
          python3 Scripts/ci_github.py simulator \
            --inventory "$INVENTORY" \
            --name "iPhone 17" \
            --device-type "com.apple.CoreSimulator.SimDeviceType.iPhone-17" \
            --runtime "$SIMULATOR_RUNTIME_IDENTIFIER" \
            --github-output "$GITHUB_OUTPUT"

      - name: Clean and boot exact simulator
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl erase "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Validate test plan JSON
        run: |
          PLAN=SnapDrill.xcodeproj/xcshareddata/xctestplans/AllTests.xctestplan
          python3 -c "import json, sys; json.load(open('$PLAN'))" && echo "xctestplan JSON OK"

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme AllTests \
            -clonedSourcePackagesDirPath "$HOME/.spm-cache/snapdrill"

      - name: Build for testing
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild build-for-testing \
            -scheme AllTests \
            -testPlan AllTests \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            -clonedSourcePackagesDirPath "$HOME/.spm-cache/snapdrill" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Resolve unique AllTests xctestrun
        id: xctestrun
        run: |
          python3 Scripts/ci_github.py xctestrun \
            --root "$GITHUB_WORKSPACE/DerivedData/Build/Products" \
            --pattern 'AllTests_*.xctestrun' \
            --github-output "$GITHUB_OUTPUT"

      - name: Test without building
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.udid }}
          XCTESTRUN_PATH: ${{ steps.xctestrun.outputs.path }}
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/TestResults.xcresult"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN_PATH" \
            -only-test-configuration CI \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$GITHUB_WORKSPACE/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # #922-B will move attempt evidence outside the checkout before later jobs/runs can clean it.

  ui-tests:
    name: UI Tests (develop only)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    # app 级 XCUITest（驱动真 app UI）慢且对模拟器生命周期敏感，不进每-PR 门禁；
    # 仅在 develop 合并（push）或手动触发时跑，且 needs:build → 单测/lint 过了才跑。
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Verify checkout identity
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checkout HEAD does not match GITHUB_SHA"
            exit 1
          fi
          echo "Checkout identity: $GITHUB_SHA"

      - name: Validate exact toolchain
        run: |
          export PATH="$HOME/bin:$PATH"
          printf '%s\n' "$HOME/bin" >> "$GITHUB_PATH"
          python3 Scripts/ci_github.py toolchain \
            --config Configs/Toolchain.env \
            --github-env "$GITHUB_ENV"

      - name: Resolve exact simulator
        id: simulator
        run: |
          INVENTORY="$RUNNER_TEMP/snapdrill-simctl-${GITHUB_RUN_ID}-${GITHUB_JOB}.json"
          xcrun simctl list devices available -j > "$INVENTORY"
          python3 Scripts/ci_github.py simulator \
            --inventory "$INVENTORY" \
            --name "iPhone 17" \
            --device-type "com.apple.CoreSimulator.SimDeviceType.iPhone-17" \
            --runtime "$SIMULATOR_RUNTIME_IDENTIFIER" \
            --github-output "$GITHUB_OUTPUT"

      - name: Clean and boot exact simulator
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl erase "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Validate UI test plan JSON
        run: |
          PLAN=SnapDrill.xcodeproj/xcshareddata/xctestplans/UITests.xctestplan
          python3 -c "import json, sys; json.load(open('$PLAN'))" && echo "UITests xctestplan JSON OK"

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme SnapDrill \
            -clonedSourcePackagesDirPath "$HOME/.spm-cache/snapdrill"

      - name: Build for testing (UI)
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild build-for-testing \
            -scheme SnapDrill \
            -testPlan UITests \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedDataUI" \
            -clonedSourcePackagesDirPath "$HOME/.spm-cache/snapdrill" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Resolve unique UI xctestrun
        id: xctestrun
        run: |
          python3 Scripts/ci_github.py xctestrun \
            --root "$GITHUB_WORKSPACE/DerivedDataUI/Build/Products" \
            --pattern 'SnapDrill_UITests_*.xctestrun' \
            --github-output "$GITHUB_OUTPUT"

      - name: Test without building (UI)
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.udid }}
          XCTESTRUN_PATH: ${{ steps.xctestrun.outputs.path }}
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/UITestResults.xcresult"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN_PATH" \
            -only-test-configuration CI \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$GITHUB_WORKSPACE/UITestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
