name: SnapDrill CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint --strict

      - name: Build
        run: |
          xcodebuild build \
            -scheme SnapDrill \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -scheme SnapDrill \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -resultBundlePath TestResults \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Check Code Coverage
        run: |
          # 生成覆盖率报告
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          
          # 提取覆盖率百分比
          COVERAGE=$(python3 -c "import json; data=json.load(open('coverage.json')); print(data['lineCoverage']*100)")
          
          echo "📊 Code Coverage: ${COVERAGE}%"
          
          # 检查是否达到最低门槛
          MIN_COVERAGE=70
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below minimum ${MIN_COVERAGE}%"
            echo "::error::Code coverage is below the minimum threshold"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets minimum ${MIN_COVERAGE}%"
          fi

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
