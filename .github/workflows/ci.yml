name: iOS CI

on:
  push:
    branches: [ main, feature/**, fix/** ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test, and Coverage Gate
    runs-on: macos-latest
    env:
      COVERAGE_THRESHOLD: "70"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators (debug)
        run: |
          echo "Available iOS simulators:"
          xcrun simctl list devices --json | jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | .key as $ios | .value[] | select(.isAvailable == true) | "\($ios): \(.name) (\(.udid))"'
        continue-on-error: true

      - name: Resolve SwiftPM
        run: |
          xcodebuild -resolvePackageDependencies -project NotBad.xcodeproj -scheme NotBad

      - name: Run unit tests with coverage (xcresult)
        run: |
          set -o pipefail
          # Use generic iOS Simulator, let xcodebuild choose available device
          xcodebuild \
            -project NotBad.xcodeproj \
            -scheme NotBad \
            -destination 'platform=iOS Simulator,OS=latest' \
            -testPlan UnitTestPlan \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            test

      - name: Convert coverage to JSON
        run: |
          mkdir -p local_artifacts
          xcrun xccov view --report --json TestResults.xcresult > local_artifacts/coverage-local.json

      - name: Enforce coverage threshold
        run: |
          python3 Scripts/check_coverage.py local_artifacts/coverage-local.json "$COVERAGE_THRESHOLD"

      - name: Upload xcresult
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-xcresult
          path: TestResults.xcresult

      - name: Upload coverage JSON
        uses: actions/upload-artifact@v4
        with:
          name: coverage-local.json
          path: local_artifacts/coverage-local.json
