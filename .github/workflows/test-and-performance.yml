name: 测试与性能检查

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'NotBad/**/*.swift'
      - 'NotBadTests/**/*.swift'
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: 单元测试与覆盖率
    runs-on: macos-latest
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode.app
      
      - name: 运行单元测试
        run: |
          xcodebuild test \
            -scheme NotBad \
            -testPlan UnitTestPlan \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            | xcpretty
      
      - name: 计算测试覆盖率
        id: coverage
        run: |
          # 使用 xcrun 提取覆盖率数据
          COVERAGE=$(xcrun xccov view --report --json TestResults.xcresult | \
            python3 -c "import sys, json; data=json.load(sys.stdin); print(f\"{data['lineCoverage']*100:.2f}\")")
          
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "📊 测试覆盖率：$COVERAGE%"
          
          # 检查是否达标（PRD §7.2 要求 ≥60%）
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "❌ 测试覆盖率不足：$COVERAGE% < 60%"
            exit 1
          else
            echo "✅ 测试覆盖率达标：$COVERAGE% ≥ 60%"
          fi
      
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
      
      - name: 生成覆盖率报告
        if: always()
        run: |
          echo "## 📊 单元测试覆盖率报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **当前覆盖率**：${{ steps.coverage.outputs.coverage }}%" >> $GITHUB_STEP_SUMMARY
          echo "- **目标覆盖率**：≥60%（PRD §7.2 要求）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if (( $(echo "${{ steps.coverage.outputs.coverage }} >= 60" | bc -l) )); then
            echo "✅ **状态**：达标" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **状态**：不达标" >> $GITHUB_STEP_SUMMARY
          fi

  ui-tests:
    name: UI 测试
    runs-on: macos-latest
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode.app
      
      - name: 运行 UI 测试
        run: |
          xcodebuild test \
            -scheme NotBad \
            -testPlan UITestPlan \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath UITestResults.xcresult \
            | xcpretty
      
      - name: 上传 UI 测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITestResults.xcresult

  performance-tests:
    name: 性能基线测试
    runs-on: macos-latest
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode.app
      
      - name: 运行性能测试
        id: perf-test
        run: |
          xcodebuild test \
            -scheme NotBad \
            -testPlan PerformanceTestPlan \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath PerfTestResults.xcresult \
            | xcpretty
      
      - name: 分析性能指标
        id: perf-analysis
        run: |
          # 提取性能指标（需要解析 xcresult）
          # 这里是简化示例，实际需要使用 xcrun xcresulttool
          
          echo "## 📈 性能基线检查报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PRD §5.1 性能要求对比：" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 指标 | 要求 | 实际 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 应用启动时间（P90） | ≤1.2s | TBD | ⏳ |" >> $GITHUB_STEP_SUMMARY
          echo "| OCR 处理时间（P90） | ≤2.5s | TBD | ⏳ |" >> $GITHUB_STEP_SUMMARY
          echo "| UI 交互响应（P90） | ≤120ms | TBD | ⏳ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 *完整性能分析需要实际设备测试，CI 仅做冒烟测试*" >> $GITHUB_STEP_SUMMARY
      
      - name: 上传性能测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-test-results
          path: PerfTestResults.xcresult

  build-check:
    name: 编译检查
    runs-on: macos-latest
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode.app
      
      - name: 验证编译（Debug）
        run: |
          xcodebuild build \
            -scheme NotBad \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -configuration Debug \
            | xcpretty
      
      - name: 验证编译（Release）
        run: |
          xcodebuild build \
            -scheme NotBad \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -configuration Release \
            | xcpretty
      
      - name: 检查 Swift 版本与部署目标
        run: |
          echo "## ⚙️  工程配置检查" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 检查 SWIFT_VERSION（PRD §3.1 要求 Swift 6.2）
          SWIFT_VERSION=$(xcodebuild -showBuildSettings -scheme NotBad | grep SWIFT_VERSION | awk '{print $3}')
          echo "- **Swift 版本**：$SWIFT_VERSION（要求：6.2）" >> $GITHUB_STEP_SUMMARY
          
          # 检查 IPHONEOS_DEPLOYMENT_TARGET（PRD §3.1 要求 iOS 26.0）
          IOS_TARGET=$(xcodebuild -showBuildSettings -scheme NotBad | grep IPHONEOS_DEPLOYMENT_TARGET | awk '{print $3}')
          echo "- **iOS 部署目标**：$IOS_TARGET（要求：26.0）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 警告：如果版本不匹配
          if [ "$SWIFT_VERSION" != "6.2" ]; then
            echo "⚠️  Swift 版本与 PRD 要求不一致，参考 ROADMAP Phase 1" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "$IOS_TARGET" != "26.0" ]; then
            echo "⚠️  iOS 部署目标与 PRD 要求不一致，参考 ROADMAP Phase 1" >> $GITHUB_STEP_SUMMARY
          fi

  swiftlint:
    name: 代码规范检查
    runs-on: macos-latest
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 安装 SwiftLint
        run: brew install swiftlint
      
      - name: 运行 SwiftLint
        run: |
          if [ -f .swiftlint.yml ]; then
            swiftlint lint --reporter github-actions-logging
          else
            echo "⚠️  未找到 .swiftlint.yml 配置文件"
          fi
