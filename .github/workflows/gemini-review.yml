name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

jobs:
  gemini-review:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR diff (Swift & config files only)
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- '*.swift' '*.yml' '*.yaml' '*.xcconfig' '*.json' '*.py' \
            > pr_diff.txt
          echo "Diff size: $(wc -c < pr_diff.txt) bytes"

      - name: Collect full content of ALL Swift files
        run: |
          # 收集全量 Swift 文件（而非仅变动文件），让 Gemini 可以看到 ViewModel 声明、
          # 协议实现等未变动但与 diff 强相关的上下文，减少因窗口截断导致的假阳性。
          > full_files.txt
          find . -name "*.swift" \
            ! -path "./.build/*" \
            ! -path "./build/*" \
            ! -path "./.swiftpm/*" \
            | sort \
            | while IFS= read -r file; do
              echo "=== FILE: $file ===" >> full_files.txt
              cat "$file" >> full_files.txt
              echo "" >> full_files.txt
            done
          echo "Full files size: $(wc -c < full_files.txt) bytes"

      - name: Gemini code review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 Scripts/gemini_review.py

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f review_comment.txt ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --body-file review_comment.txt
          fi
