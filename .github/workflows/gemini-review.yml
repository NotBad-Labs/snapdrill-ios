name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

jobs:
  gemini-review:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR diff (Swift & config files only)
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- '*.swift' '*.yml' '*.yaml' '*.xcconfig' '*.json' \
            > pr_diff.txt
          echo "Diff size: $(wc -c < pr_diff.txt) bytes"

      - name: Gemini code review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request, urllib.error, sys

          pr_number = os.environ['PR_NUMBER']
          pr_title  = os.environ['PR_TITLE']
          api_key   = os.environ['GEMINI_API_KEY']

          with open('pr_diff.txt', 'r', encoding='utf-8', errors='replace') as f:
              diff = f.read()

          # diff 为空时跳过（纯文档/资产变更）
          if not diff.strip():
              print("No reviewable file changes, skipping.")
              with open('review_comment.txt', 'w') as f:
                  f.write("## Gemini Code Review\n\n本次 PR 无 Swift/配置文件变更，跳过自动审查。")
              sys.exit(0)

          # 超出 token 限制时截断
          if len(diff) > 40000:
              diff = diff[:40000] + "\n\n[... diff 过长，已截断 ...]"

          prompt = f"""你是一个经验丰富的 iOS Swift 代码审查专家。请审查以下 PR。

PR 标题：{pr_title}

审查重点（按优先级）：
1. **逻辑错误和边界情况** — 潜在崩溃、空指针、数组越界
2. **Swift 6 并发安全性** — @MainActor 隔离是否正确？Task 是否保存了句柄？是否有 data race 风险？禁止 @unchecked Sendable
3. **SwiftData 使用** — ModelContext 操作是否在正确 actor？是否有跨 context 竞态？
4. **架构符合性** — 违反以下规范时必须指出：
   - 禁止新增 Domain 层、UseCase 层、Repository 协议
   - ViewModel 必须是 @Observable @MainActor final class
   - 禁止 force unwrap !、any existentials
   - 禁止 print()，必须用 SnapDrillLogger
5. **代码质量** — 是否存在不必要的复杂度？

请用中文回复。格式：
- 🔴 严重：必须修复才能合并
- 🟡 警告：强烈建议修复
- 🟢 建议：可选优化
- 如代码质量良好，明确说明"无问题"

每个问题注明具体文件/位置和修改建议。

PR Diff:
```
{diff}
```"""

          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"temperature": 0.1}
          }

          url = (
              "https://generativelanguage.googleapis.com/v1beta"
              f"/models/gemini-2.0-flash:generateContent?key={api_key}"
          )

          try:
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode('utf-8'),
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=120) as resp:
                  result = json.loads(resp.read())
                  review_text = result['candidates'][0]['content']['parts'][0]['text']
          except Exception as e:
              review_text = f"⚠️ Gemini API 调用失败：{e}"

          comment = (
              "## Gemini Code Review\n\n"
              + review_text
              + "\n\n---\n*由 Gemini 自动生成。合并前请人工确认。*"
          )

          with open('review_comment.txt', 'w', encoding='utf-8') as f:
              f.write(comment)

          print("Review generated.")
          EOF

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f review_comment.txt ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --body-file review_comment.txt
          fi
