name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

jobs:
  gemini-review:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR diff (Swift & config files only)
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- '*.swift' '*.yml' '*.yaml' '*.xcconfig' '*.json' '*.py' \
            > pr_diff.txt
          echo "Diff size: $(wc -c < pr_diff.txt) bytes"

      - name: Gemini code review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 Scripts/gemini_review.py

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f review_comment.txt ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --body-file review_comment.txt
          fi
