name: Link Check

on:
  push:
    branches: [ main, develop, 'release/**' ]
  pull_request:
    branches: [ main, develop, 'release/**' ]

jobs:
  lychee:
    runs-on: [self-hosted, macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lychee
        run: |
          set -euo pipefail
          if ! command -v lychee >/dev/null 2>&1; then
            echo "Installing lychee..."
            # 检查系统架构和现有安装
            if [[ "$(uname -m)" == "arm64" ]]; then
              ARCH="aarch64"
              HOMEBREW_PREFIX="/opt/homebrew"
            else
              ARCH="x86_64"
              HOMEBREW_PREFIX="/usr/local"
            fi
            
            # 尝试使用现有的Homebrew
            if command -v brew >/dev/null 2>&1; then
              echo "Using existing Homebrew to install lychee"
              brew install lychee
            else
              # 手动下载安装
              echo "Manually installing lychee for ${ARCH}"
              curl -sSL "https://github.com/lycheeverse/lychee/releases/latest/download/lychee-${ARCH}-apple-darwin.tar.gz" -o /tmp/lychee.tar.gz
              mkdir -p /tmp/lychee
              tar -xzf /tmp/lychee.tar.gz -C /tmp/lychee --strip-components=1
              
              # 安装到用户目录避免权限问题
              mkdir -p "$HOME/.local/bin"
              mv /tmp/lychee/lychee "$HOME/.local/bin/lychee"
              echo "$HOME/.local/bin" >> $GITHUB_PATH
              chmod +x "$HOME/.local/bin/lychee"
            fi
          fi
          
          # 验证安装
          lychee --version

      - name: Run lychee link checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          lychee \
            --accept 200,204,301,302,307,308 \
            --verbose \
            --no-progress \
            --exclude-file .lycheeignore \
            --config .lychee.toml \
            "**/*.md"
