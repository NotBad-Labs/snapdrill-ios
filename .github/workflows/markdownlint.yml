name: Markdown Lint

on:
  workflow_dispatch:

jobs:
  markdownlint:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: |
          npm install -g markdownlint-cli@0.41.0

      - name: Run markdownlint
        run: |
          markdownlint "**/*.md" --ignore node_modules --config .markdownlint.jsonc
