name: Gemini Project Review

on:
  workflow_dispatch:
    inputs:
      module:
        description: "审查模块"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - core
          - data
          - ui
          - features
          - infrastructure
      phase:
        description: "审查阶段"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - architecture
          - tests

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Gemini Project Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODULE: ${{ inputs.module }}
          REVIEW_PHASE: ${{ inputs.phase }}
        run: python Scripts/gemini_project_review.py

      - name: Read review output
        id: read_review
        run: |
          OUTPUT_FILE="review_${{ inputs.module }}_${{ inputs.phase }}.txt"
          # GitHub Issue body 上限约 65536 字符，超出时截断并提示
          CONTENT=$(head -c 60000 "$OUTPUT_FILE")
          CHAR_COUNT=$(wc -c < "$OUTPUT_FILE")
          if [ "$CHAR_COUNT" -gt 60000 ]; then
            CONTENT="$CONTENT"$'\n\n---\n*⚠️ 内容超过 60000 字符，已截断。完整报告见 Actions 产物。*'
          fi
          # 多行内容写入 GITHUB_OUTPUT
          {
            echo "content<<REVIEW_EOF"
            echo "$CONTENT"
            echo "REVIEW_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-review-${{ inputs.module }}-${{ inputs.phase }}
          path: review_${{ inputs.module }}_${{ inputs.phase }}.txt
          retention-days: 30

      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const module = '${{ inputs.module }}';
            const phase  = '${{ inputs.phase }}';
            const phaseLabel = { architecture: '架构审查', tests: '测试审查', both: '综合审查' }[phase] || phase;
            const now = new Date().toISOString().split('T')[0];

            const body = `${{ steps.read_review.outputs.content }}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[Gemini 全项目审查] ${module.toUpperCase()} / ${phaseLabel} — ${now}`,
              body:  body,
              labels: ['gemini-review', 'automated'],
            });
