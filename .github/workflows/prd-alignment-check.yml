name: PRD 对齐检查

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  prd-alignment-check:
    name: 验证 PR 是否对齐 PRD
    runs-on: macos-latest
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 检查 PR 描述包含 PRD 引用
        id: check-prd-reference
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          
          # 检查是否包含 PRD 章节引用（格式：§X.Y 或 §X.Y.Z）
          if echo "$PR_BODY" | grep -qE '§[0-9]+\.[0-9]+(\.[0-9]+)?|PRD.*章节.*[0-9]+\.[0-9]+'; then
            echo "✅ PR 包含 PRD 引用"
            echo "has_prd_reference=true" >> $GITHUB_OUTPUT
          else
            echo "❌ PR 缺少 PRD 引用"
            echo "has_prd_reference=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: 检查 PR 描述包含验收标准
        id: check-acceptance-criteria
        if: success()
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          
          # 检查是否包含验收标准（格式：AC-XXX-YYY-NN）
          if echo "$PR_BODY" | grep -qE 'AC-[A-Z]+-[A-Z]+-[0-9]+|验收标准|验收与测试'; then
            echo "✅ PR 包含验收标准"
            echo "has_ac=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  PR 建议包含验收标准引用"
            echo "has_ac=false" >> $GITHUB_OUTPUT
            # 不强制失败，仅警告
          fi
      
      - name: 检查代码是否有反向约束 PRD 的注释
        id: check-reverse-constraints
        if: success()
        run: |
          # 搜索可能的反向约束注释
          REVERSE_PATTERNS=(
            "TODO.*PRD.*应该"
            "TODO.*PRD.*需要"
            "TODO.*PRD.*必须"
            "FIXME.*PRD"
            "PRD.*有问题"
            "PRD.*应该改"
          )
          
          FOUND_VIOLATIONS=0
          for pattern in "${REVERSE_PATTERNS[@]}"; do
            if grep -rn --include="*.swift" -E "$pattern" NotBad/; then
              echo "❌ 发现反向约束 PRD 的注释：$pattern"
              FOUND_VIOLATIONS=$((FOUND_VIOLATIONS + 1))
            fi
          done
          
          if [ $FOUND_VIOLATIONS -gt 0 ]; then
            echo ""
            echo "🚨 发现 $FOUND_VIOLATIONS 处反向约束 PRD 的注释"
            echo "   请移除这些注释，或先走【流程 A：PRD 变更流程】"
            echo "   参考：docs/WORKFLOW.md"
            exit 1
          else
            echo "✅ 未发现反向约束 PRD 的注释"
          fi
      
      - name: 检查新文件是否包含 PRD 溯源注释
        id: check-prd-traceability
        if: success()
        run: |
          # 获取新增的 Swift 文件
          git fetch origin main
          NEW_FILES=$(git diff --name-only --diff-filter=A origin/main...HEAD | grep "\.swift$" || true)
          
          if [ -z "$NEW_FILES" ]; then
            echo "ℹ️  本次 PR 无新增 Swift 文件"
            exit 0
          fi
          
          echo "检查新增文件的 PRD 溯源注释："
          MISSING_TRACEABILITY=0
          
          for file in $NEW_FILES; do
            echo "  检查: $file"
            
            # 检查文件顶部是否有 PRD 溯源注释
            if head -20 "$file" | grep -qE 'PRD.*章节|PRD.*§|验收标准.*AC-'; then
              echo "    ✅ 包含 PRD 溯源注释"
            else
              echo "    ⚠️  缺少 PRD 溯源注释"
              MISSING_TRACEABILITY=$((MISSING_TRACEABILITY + 1))
            fi
          done
          
          if [ $MISSING_TRACEABILITY -gt 0 ]; then
            echo ""
            echo "⚠️  建议在新文件顶部添加 PRD 溯源注释，例如："
            echo "   //  PRD 章节：§4.3.1"
            echo "   //  验收标准：AC-UC-OCR-01"
            echo "   //  性能要求：§5.1 OCR P90 ≤ 2.5s"
            echo ""
            echo "   参考：docs/WORKFLOW.md - 流程 B Step 2"
            # 不强制失败，仅警告
          fi
      
      - name: 生成检查报告
        if: always()
        run: |
          echo "## PRD 对齐检查报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check-prd-reference.outputs.has_prd_reference }}" == "true" ]; then
            echo "✅ **PRD 引用**：已包含" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **PRD 引用**：缺失（必填）" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.check-acceptance-criteria.outputs.has_ac }}" == "true" ]; then
            echo "✅ **验收标准**：已包含" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  **验收标准**：建议包含" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📚 **参考文档**：" >> $GITHUB_STEP_SUMMARY
          echo "- [工作流规范](../docs/WORKFLOW.md)" >> $GITHUB_STEP_SUMMARY
          echo "- [PRD v6.2](../docs/prd/NotBad%20错题本%20App%20-%20产品需求文档%20(PRD)%20v6.2.md)" >> $GITHUB_STEP_SUMMARY
          echo "- [贡献指南](../CONTRIBUTING.md)" >> $GITHUB_STEP_SUMMARY
      
      - name: 评论 PR（如检查失败）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ PRD 对齐检查失败
              
              你的 PR 未通过 PRD 对齐检查。请按照以下指引修复：
              
              ### 必须修复的问题：
              
              1. **缺少 PRD 引用**：请在 PR 描述中明确引用 PRD 章节
                 - 格式示例：\`PRD 章节：§4.3.1 错题捕获\`
                 - 或：\`对应 PRD §4.3.1\`
              
              2. **反向约束 PRD**：代码中包含要求修改 PRD 的注释
                 - 请移除这些注释
                 - 如确需修改 PRD，请先走 [流程 A：PRD 变更流程](../docs/WORKFLOW.md#-流程-a：prd-变更流程)
              
              ### 建议改进：
              
              - 添加验收标准引用（格式：\`AC-XXX-YYY-NN\`）
              - 在新文件顶部添加 PRD 溯源注释
              
              ### 参考文档：
              
              - 📄 [工作流规范](../docs/WORKFLOW.md)
              - 📋 [PRD v6.2](../docs/prd/NotBad%20错题本%20App%20-%20产品需求文档%20(PRD)%20v6.2.md)
              - 🤝 [贡献指南](../CONTRIBUTING.md)
              
              ---
              *此检查由 GitHub Actions 自动执行，确保代码与 PRD 保持对齐。*`
            })
