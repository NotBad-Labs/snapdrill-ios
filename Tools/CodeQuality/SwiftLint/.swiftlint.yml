included:
  - NotBad

excluded:
  - Tools
  - Resources
  - DerivedData
  - .build

opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - overridden_super_call
  - redundant_nil_coalescing

disabled_rules:
  - line_length

# 配置
function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000
