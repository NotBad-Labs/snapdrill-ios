# SwiftLint 配置文件
# 基于 NotBad 项目的代码规范

# 包含的路径
included:
  - NotBad
  - NotBadTests
  - NotBadUITests

# 排除的路径
excluded:
  - Pods
  - .build
  - DerivedData
  - NotBad.xcodeproj
  - NotBad.xcworkspace

# 规则配置
disabled_rules:
  - trailing_whitespace
  - todo

# 启用的规则
opt_in_rules:
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - force_unwrapping
  - function_default_parameter_at_end
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - nimble_operator
  - nslocalizedstring_key
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prefixed_toplevel_constant
  - prohibited_interface_builder
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - required_enum_case
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strong_iboutlet
  - switch_case_on_newline
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher
  - yoda_condition

# 规则参数
line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

identifier_name:
  min_length: 2
  max_length: 40
  excluded:
    - id
    - url
    - api
    - ui
    - db
    - ok
    - no

closure_body_length:
  warning: 30
  error: 50

cyclomatic_complexity:
  warning: 10
  error: 20

function_parameter_count:
  warning: 5
  error: 8

type_name:
  min_length: 3
  max_length: 40

# 自定义规则
custom_rules:
  # 禁止使用 print 语句
  no_print:
    name: "No Print Statements"
    regex: 'print\('
    message: "Use Logger instead of print statements"
    severity: warning
  
  # 强制使用 guard 语句
  prefer_guard:
    name: "Prefer Guard Statements"
    regex: 'if.*\{[\s\S]*?return[\s\S]*?\}'
    message: "Consider using guard statement instead of if-return"
    severity: warning
  
  # 强制使用 weak self
  weak_self:
    name: "Weak Self in Closures"
    regex: '\[.*self.*\]'
    message: "Use [weak self] in closures to avoid retain cycles"
    severity: warning

# 报告器配置
reporter: "github-actions-logging"