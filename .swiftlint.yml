# .swiftlint.yml
# SwiftLint 配置文件 - 针对 NotBad 项目优化
# Created by YIMING LIAO on 2025/9/5.

# 包含的路径
included:
  - Sources
  - Tests

# 排除的路径
excluded:
  - Carthage
  - Pods
  - .build
  - DerivedData
  - .git
  - docs

# 启用的规则
opt_in_rules:
  - array_init
  - attributes
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - force_unwrapping
  - function_default_parameter_at_end
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - nimble_operator
  - nslocalizedstring_key
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - unused_import
  - unused_private_declaration
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# 禁用的规则
disabled_rules:
  - todo
  - blanket_disable_command

# 规则配置
line_length:
  warning: 120
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 6
  error: 8

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 1000
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level:
    warning: 3
    error: 6
  statement_level:
    warning: 5
    error: 10

identifier_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 40
    error: 60
  excluded:
    - id
    - x
    - y
    - z

# 强制展开警告（生产代码应避免）
force_unwrapping:
  severity: error

# 文件头注释模板
file_header:
  required_pattern: |
                    \/\/
                    \/\/ .*\.swift
                    \/\/ NotBad
                    \/\/
                    \/\/ Created by .* on \d{1,2}\/\d{1,2}\/\d{2,4}\.
                    \/\/

# 强制使用尾随闭包
trailing_closure:
  only_single_muted_parameter: true

# 排序导入
sorted_imports:
  severity: warning

# 垂直空白
vertical_whitespace:
  max_empty_lines: 2

# 类型名称
type_name:
  min_length: 3
  max_length: 40
  excluded:
    - ID
    - URL
    - API

# 变量名称
variable_name:
  min_length: 3
  max_length: 40
  excluded:
    - id
    - url
    - api

# 自定义规则
custom_rules:
  # 禁止使用 print() 在生产代码中
  no_print:
    name: "No Print"
    regex: "print\\("
    match_kinds:
      - identifier
    message: "Use logger instead of print()"
    severity: warning

  # 确保异步函数使用 async/await
  async_await_usage:
    name: "Async/Await Usage"
    regex: "DispatchQueue\\.main\\.async"
    message: "Use async/await instead of DispatchQueue"
    severity: warning

  # 确保错误处理使用 Result 类型
  result_type_usage:
    name: "Result Type Usage"
    regex: "completion:.*Error"
    message: "Consider using Result<Success, Error> type"
    severity: warning

# 报告器类型
reporter: "github-actions-logging"

# 分析器规则（静态分析）
analyzer_rules:
  - explicit_self
  - unused_import
  - unused_declaration

# 测试覆盖率相关
coverage:
  min_percentage: 80  # 最低80%测试覆盖率
  exclude_files:
    - "*/Tests/*"
    - "*/UITests/*"
