# docaudit 策略 SSOT
#
# 规则分级：
#   error   — exit 1，CI 阻断合并
#   warning — exit 0，stderr 镜像摘要（--strict 升级为 error）
#   info    — stdout summary，无副作用
#
# legacy_whitelist 是 **finding 级** post-filter（Codex 主锚 Review Critical 1 修复）：
#   规则按 check + paths + categories 匹配，命中后 finding 标记 suppressed 不参与 exit code。
#   新增违规（不匹配任何白名单）仍按原级别阻断，防回归。
#
# 修改检查级别或白名单只改本文件，不改 docaudit.py。

version: 1

# 审计范围
scan:
  include:
    - docs/
    - .claude/
    - Scripts/
    - STATUS.md
    - CLAUDE.md
    - AGENTS.md
    - README.md
  exclude:
    - .claude/worktrees/                 # 临时副本
    - .claude/skills/                    # 社区 skill（上游交叉引用不由我们维护）
    - docs/archive/                       # 归档文档，不再校验
    - Scripts/audit/                      # 审计器自身（README 示例 / policy 声明会自触发，元循环）

# 10 个结构子命令默认级别（外加 `frontmatter` subprocess，`docaudit all` 共 11 check）
checks:
  links:
    level: error
    description: Markdown 内部引用链接指向不存在的文件

  archived-refs:
    level: error
    description: 对已归档研究的**旧路径** `docs/research/*` 硬引用（应改用 `docs/archive/research/` 新路径）
    archived_sources:
      # 旧路径（deprecated）— 物理文件已迁到 docs/archive/research/ （Phase C PR-α2）。
      # 保留旧路径作为禁用字符串检测：任何文件出现 `docs/research/<name>.md` 即 error。
      # 新路径 `docs/archive/research/<name>.md` 是合法叙述引用，不命中（字符串不同）。
      - docs/research/harness-engineering-study-20260418.md
      - docs/research/hermes-agent-study-20260418.md

  orphans:
    level: warning
    description: docs/**/*.md 在全仓零引用
    whitelist:
      - docs/product/**            # 产品文档独立入口
      - docs/archive/**            # 归档文档豁免
      - docs/tech/reference/**     # 工具链参考独立入口
      - docs/KNOWLEDGE_MAP.md      # 自身是索引
      - docs/DOC_DEPENDENCY_MAP.md # 自身是依赖图

  home-path-refs:
    level: warning
    description: 仓库内对 ~/.claude/ 私有路径的硬编码
    allowed_contexts:
      # 纪律文档本身解释 home-path 用法，允许引用（规则定义文件）
      - docs/standards/memory-routing.md
      - docs/standards/permission-model.md
      - docs/standards/execution-gates.md
      - docs/standards/skill-architecture.md
      - docs/audits/README.md
      # 工具脚本，功能就是扫描私有空间
      - Scripts/recall-index.sh

  rule-usage:
    level: info
    description: F-NNN 规则外部引用计数（0 引用 = dead rule 候选）
    min_references: 1

  skill-inventory:
    level: error
    description: skill 目录架构计数与 Claude adapter 指向必须匹配 `docs/standards/skill-architecture.md`

  skill-links:
    level: error
    description: 共享 skill 源内相对 Markdown 引用必须指向存在的文件

  skill-provenance:
    level: error
    description: 共享 community skill 必须被结构化 skills-lock.json、project-owned 白名单或 legacy skill-source-ledger snapshot 覆盖，vendored 与 ledger Claude-only 条目必须校验 local blob
    # Only list skills that are genuinely SnapDrill-owned. This bypasses community
    # blob enforcement and must not be used to silence vendored-skill drift.
    project_owned:
      - api-research
      - cross-audit
      - cross-audit-consensus
      - decision-closeout
      - dependency-propagation
      - dod-checklist
      - harness-recall
      - knowledge-health
      - phase-closeout
      - post-merge
      - resume-from-handoff
      - snapshot-diff-review
      - sprint-contract
      - verify-audit-report
      - xcode-review

  verdict-sync:
    level: warning
    description: verdict 分布声明跨文件漂移（同一标签出现多个 distinct 数字）
    scan_paths:
      - STATUS.md
      - docs/memory/handoff.md
      - docs/memory/decisions.md

  external-gap-expiry:
    level: warning
    description: VALID_WITH_GAP 文件 frontmatter 必须含结构化 gap_type / gap_due / gap_owner 字段以支持机械到期检查

# Finding 级豁免规则（Phase C 清理前过渡）
# 每条规则：
#   check:       policy `checks:` 段 10 项之一（frontmatter subprocess 不在此列）（必填）
#   reason:      豁免理由（必填，非空）
#   expires_on:  YYYY-MM-DD 硬截止（必填，无效日期 exit 2）
#   paths:       文件 glob 列表（可选，空 = 匹配该 check 所有 finding）
#   categories:  finding category 列表（可选，空 = 匹配所有 category）
#
# Phase C 每个清理 PR 应从本列表删除对应条目，直到全空。
legacy_whitelist:
  # Phase A 审计 archived-refs 命中已由 Phase C PR-α2 全部修复（docs/research → docs/archive/research）
  # 故此处不再需要 archived-refs 豁免

  # Phase A 孤儿候选
  - check: orphans
    reason: "Phase A 基线：候选孤儿待人工分层（hard / soft / intentionally parked）"
    expires_on: "2026-05-31"

  # 路径 C #018 后：.agents/skills/swiftui-pro/SKILL.md 引用 references/body-reevaluation.md / lazy-loading.md / view-identity.md / common-pitfalls.md，
  # 但 .agents/skills/swiftui-pro/references/ 实际含 accessibility/api/data/design/hygiene/navigation/performance/swift/views.md
  # （上游 SKILL.md 引用与实际 references/ 文件名不一致——这是 .agents/ SSOT 上游问题，路径 C #018 ratify 后续 PR 处理）
  - check: skill-links
    reason: "路径 C #018 ratify 暴露的 .agents/skills/swiftui-pro 上游 references 引用不一致；待上游同步或后续 PR 修复 SKILL.md 链接"
    expires_on: "2026-06-30"

  # 路径 C #018 期间 DOWNGRADE/MERGE 到 docs/templates/ 的 skill 内容继承了 ~/.claude/... 私有路径引用（来自原 skill 文本），
  # 以及 docs/audits/skill-audit-task-definition.md 中 inline 的 SKILL.md 摘要含 ~/.claude/... 引用
  # 后续 PR 批量替换为描述性表述（Claude 私有目录，git-untracked）
  - check: home-path-refs
    reason: "路径 C #018 期间 DOWNGRADE/MERGE 的 skill 内容继承 ~/.claude 私有路径；待后续 PR 批量脱敏"
    expires_on: "2026-06-30"

  # 路径 D #028 F1 修复：3 个 swift* skill 通过直接编辑 SKILL.md 补 derived_from frontmatter（未走 skills-lock.json 更新流程），
  # 触发 skill-provenance managed_local_blob_mismatch。tdd-feature 是 pre-session 已有 blob mismatch（未追踪原因）。
  # 待后续 PR 走 lockfile 同步流程（更新 skills-lock.json 记录新 blob）。
  # 由 user-decision-log [#028](docs/meta/user-decision-log.md#028) 元规则搭建期完结同 PR 一并 push，故需豁免。
  - check: skill-provenance
    reason: "路径 D [#028](docs/meta/user-decision-log.md#028) F1 修复直接编辑 SKILL.md + tdd-feature pre-session 遗留；待后续 PR 走 lockfile 同步流程"
    expires_on: "2026-06-30"

# 输出
output:
  tsv_dir: reports/
  summary_stdout: true
  verbose_default: false
