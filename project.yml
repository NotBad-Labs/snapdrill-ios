name: SnapDrill
options:
  bundleIdPrefix: com.notbadlabs
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  knownRegions:
    - en
    - zh-Hans
    - zh-Hant
    - ja
    - ko
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SnapDrill:
    type: application
    platform: iOS
    sources:
      - path: SnapDrill
        excludes:
          - Resources/Info.plist
          - Resources/SnapDrill.entitlements
          - Resources/SnapDrill.storekit
    info:
      path: SnapDrill/Resources/Info.plist
      properties:
        CFBundleDisplayName: SnapDrill
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "SnapDrill uses the camera to photograph homework and exam mistakes entirely on your device."
        UILaunchScreen:
          UIColorName: PaperBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notbadlabs.snapdrill
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: SnapDrill/Resources/SnapDrill.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  SnapDrillTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SnapDrillTests
    dependencies:
      - target: SnapDrill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notbadlabs.snapdrill.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SnapDrill.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SnapDrill"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: "-"
schemes:
  SnapDrill:
    build:
      targets:
        SnapDrill: all
    run:
      storeKitConfiguration: SnapDrill/Resources/SnapDrill.storekit
    test:
      targets:
        - SnapDrillTests
