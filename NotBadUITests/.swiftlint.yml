# SwiftLint overrides for UI test files
# UI tests often use short temp variables and less strict imports.

disabled_rules:
  - file_header
  - sorted_imports

identifier_name:
  min_length: 1
  max_length: 40
  excluded:
    - i
    - j
    - k
    - m
    - x
    - y

force_unwrapping:
  severity: warning
