# Lychee link checker configuration
# See https://github.com/lycheeverse/lychee for options

max_concurrency = 8
timeout = 20
retry_wait_time = 2
max_retries = 2
user_agent = "NotBadDocsLinkChecker/1.0 (+https://github.com/your-org/NotBad)"
accept = [200, 204, 301, 302, 307, 308]

exclude = [
  # Ignore mailto links and anchors without http(s)
  "^mailto:",
  "^tel:",
  "^#",
]